[project]
name = "anp-precos"
version = "0.1.0"
description = "Radar de preços de combustíveis da ANP em PySpark e Databricks"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["F821", "E402", "B018"]  # spark, dbutils e display vêm do runtime do Databricks

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
